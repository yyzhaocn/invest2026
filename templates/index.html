<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金分析器 - 专业基金数据分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            margin: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 30px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1em;
        }
        
        .input-container {
            position: relative;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-hint {
            margin-top: 8px;
            font-size: 0.9em;
            color: #95a5a6;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e1e8ed;
        }
        
        .features h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .feature-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        
        .feature-item:hover {
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .feature-text {
            font-size: 0.9em;
            color: #7f8c8d;
            font-weight: 500;
        }
        
        .api-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .api-info h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .api-info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e1e8ed;
            color: #95a5a6;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 基金分析器</h1>
            <p>专业的基金数据分析工具，一键生成详细分析报告</p>
        </div>
        
        <form id="fundForm">
            <div class="form-group">
                <label for="fundCode">基金代码</label>
                <div class="input-container">
                    <input type="text" 
                           id="fundCode" 
                           name="fund_code" 
                           placeholder="请输入6位基金代码，如：006253"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           required>
                </div>
                <div class="input-hint">
                    请输入6位数字基金代码，系统将自动获取基金详细信息并生成分析报告
                </div>
            </div>
            
            <button type="submit" class="btn" id="analyzeBtn">
                🔍 开始分析
            </button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析基金数据，请稍候...</p>
        </div>
        
        <div class="result" id="result"></div>
        
        <div class="features">
            <h3>🚀 功能特色</h3>
            <div class="feature-grid">
                <div class="feature-item">
                    <div class="feature-icon">📈</div>
                    <div class="feature-text">净值走势分析</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">规模变动图表</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">仓位变化分析</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💼</div>
                    <div class="feature-text">资产配置详情</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📋</div>
                    <div class="feature-text">持仓股票信息</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">👨‍💼</div>
                    <div class="feature-text">基金经理信息</div>
                </div>
            </div>
        </div>
        
        <div class="api-info">
            <h4>🔗 API接口</h4>
            <p>您也可以通过API直接获取分析报告：</p>
            <p><code>GET /api/analyze/006253</code> - 分析指定基金</p>
            <p><code>GET /report/006253</code> - 直接查看HTML报告</p>
        </div>
        
        <div class="footer">
            <p>© 2024 基金分析器 | 数据来源于东方财富网</p>
        </div>
    </div>
    
    <script>
        document.getElementById('fundForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fundCode = document.getElementById('fundCode').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            // 验证输入
            if (!fundCode || !/^\d{6}$/.test(fundCode)) {
                showResult('请输入有效的6位基金代码', 'error');
                return;
            }
            
            // 显示加载状态
            loading.style.display = 'block';
            result.style.display = 'none';
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '分析中...';
            
            try {
                const formData = new FormData();
                formData.append('fund_code', fundCode);
                
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 在新窗口中打开报告
                    const newWindow = window.open('', '_blank');
                    if (newWindow) {
                        newWindow.document.write(data.html_content);
                        newWindow.document.close();
                        showResult(`✅ ${data.message}`, 'success');
                    } else {
                        // 如果弹窗被阻止，显示报告链接
                        showResult(`✅ ${data.message} <br><a href="/report/${fundCode}" target="_blank" style="color: #007bff; text-decoration: underline;">点击查看报告</a>`, 'success');
                    }
                } else {
                    showResult(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ 网络错误: ${error.message}`, 'error');
            } finally {
                // 隐藏加载状态
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '🔍 开始分析';
            }
        });
        
        function showResult(message, type) {
            const result = document.getElementById('result');
            result.innerHTML = message;  // 使用innerHTML而不是textContent以支持HTML
            result.className = `result ${type}`;
            result.style.display = 'block';
            
            // 3秒后自动隐藏成功消息（但不隐藏包含链接的消息）
            if (type === 'success' && !message.includes('<a href=')) {
                setTimeout(() => {
                    result.style.display = 'none';
                }, 3000);
            }
        }
        
        // 输入验证
        document.getElementById('fundCode').addEventListener('input', function(e) {
            // 只允许数字输入
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            
            // 限制6位数字
            if (e.target.value.length > 6) {
                e.target.value = e.target.value.slice(0, 6);
            }
        });
    </script>
</body>
</html>
