<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市场热度 - {{ stock_code }}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1500px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 3px solid #3498db; }
        .page-header h1 { font-size: 28px; color: #2c3e50; }
        .page-header .date { font-size: 14px; color: #7f8c8d; }
        .loading-banner { text-align: center; padding: 40px; color: #7f8c8d; }
        .loading-banner.hidden { display: none; }
        .comment-header { display: flex; align-items: flex-start; padding: 15px 20px; background: #f5f5f5; border-radius: 6px; margin-bottom: 24px; border-left: 4px solid #ff9800; }
        .comment-header .icon { width: 28px; height: 28px; background: #ff9800; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-right: 12px; flex-shrink: 0; }
        .comment-header .text { color: #e65100; font-size: 15px; line-height: 1.7; }
        .score-row { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 900px) { .score-row { grid-template-columns: 1fr; } }
        .score-card { background: linear-gradient(135deg, #3498db, #2980b9); color: white; border-radius: 10px; padding: 24px; text-align: center; }
        .score-card .big { font-size: 48px; font-weight: bold; }
        .score-card .lbl { margin-top: 8px; opacity: 0.9; }
        .score-card .rec { display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 20px; background: rgba(255,255,255,0.25); font-size: 13px; }
        .sub-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        @media (max-width: 700px) { .sub-scores { grid-template-columns: repeat(2, 1fr); } }
        .sub-score { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 14px; text-align: center; }
        .sub-score .val { font-size: 22px; font-weight: bold; color: #3498db; }
        .sub-score .lbl { font-size: 12px; color: #7f8c8d; margin-top: 6px; }
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        @media (max-width: 1100px) { .content-grid { grid-template-columns: 1fr; } }
        .chart-section { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .chart-section h3 { font-size: 16px; color: #1565c0; margin-bottom: 12px; text-align: center; }
        .desc { font-size: 14px; line-height: 1.8; color: #2c3e50; margin-bottom: 12px; padding: 12px; background: white; border-radius: 6px; }
        .highlight-red { color: #e74c3c; font-weight: bold; }
        .highlight-green { color: #27ae60; font-weight: bold; }
        .chart-box { width: 100%; height: 380px; }
        .analysis-panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
        .analysis-panel h3 { font-size: 16px; margin-bottom: 12px; color: #2c3e50; }
        .analysis-list { list-style: none; }
        .analysis-list li { padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #555; }
        .raw-data-container { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; overflow: hidden; }
        .raw-data-header { background: #343a40; color: white; padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; }
        .raw-data-toggle { transition: transform 0.3s; }
        .raw-data-toggle.collapsed { transform: rotate(-90deg); }
        .raw-data-content { padding: 16px; max-height: 400px; overflow-y: auto; background: white; border-top: 1px solid #e9ecef; }
        .raw-data-content.collapsed { display: none; }
        .raw-data-json { font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
        #mainContent { display: none; }
        #mainContent.visible { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header"><h1>市场热度</h1><div class="date" id="pageDate">加载中...</div></div>
    <div class="loading-banner" id="loadingBanner">正在加载市场热度数据...</div>
    <div id="mainContent">
        <div class="comment-header"><div class="icon">💡</div><div class="text" id="headerText"><strong>点评</strong> | --</div></div>
        <div class="score-row">
            <div class="score-card"><div class="big" id="overallScore">--</div><div class="lbl">市场参与综合分</div><div class="rec" id="recommendation">--</div></div>
            <div class="sub-scores" id="subScores"></div>
        </div>
        <div class="content-grid">
            <div class="chart-section">
                <h3>用户关注指数</h3>
                <div class="desc" id="attentionDesc">--</div>
                <div class="chart-box" id="attention-chart"></div>
            </div>
            <div class="chart-section">
                <h3>市场参与意愿</h3>
                <div class="desc" id="participationDesc">--</div>
                <div class="chart-box" id="participation-chart"></div>
            </div>
        </div>
        <div class="analysis-panel"><h3>热度分析</h3><ul class="analysis-list" id="analysisList"></ul></div>
    </div>
    <div class="raw-data-container">
        <div class="raw-data-header" onclick="toggleRawData()"><span id="rawDataTitle">📊 Raw Data (Module 4)</span><span class="raw-data-toggle collapsed">▼</span></div>
        <div class="raw-data-content collapsed" id="rawDataContent"><div class="raw-data-json" id="rawDataJson">Loading...</div></div>
    </div>
</div>
<script>
const stockCode = '{{ stock_code }}';
let attentionChart, participationChart;

function extractRows(obj) { return (obj && obj.result && obj.result.data) ? obj.result.data : []; }
function sortByDate(rows, key) {
    return rows.slice().sort((a, b) => new Date(a[key] || 0) - new Date(b[key] || 0));
}
function fmtShortDate(raw) {
    if (!raw) return '';
    const d = new Date(String(raw).replace(' ', 'T'));
    if (isNaN(d.getTime())) return String(raw).slice(5, 10);
    return (d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}
function fmtNum(v, d=2) { return (v==null||isNaN(Number(v)))?'--':Number(v).toFixed(d); }

function parseModule(mw) {
    const raw = mw.raw_data || {};
    return {
        summary: mw.summary || {},
        focusRows: sortByDate(extractRows(raw.market_focus_data), 'TRADE_DATE'),
        partRows: sortByDate(extractRows(raw.participation_data), 'TRADE_DATE'),
    };
}

function updateUI(mw) {
    const p = parseModule(mw);
    const s = p.summary;
    const fm = s.focus_metrics || {};
    const pm = s.participation_metrics || {};

    document.getElementById('loadingBanner').classList.add('hidden');
    document.getElementById('mainContent').classList.add('visible');
    document.title = '市场热度 - ' + stockCode;
    document.getElementById('pageDate').textContent = pm.trade_date ? fmtShortDate(pm.trade_date) : new Date().toLocaleDateString('zh-CN');

    const pc = Number(pm.participation_wish_change || 0);
    document.getElementById('headerText').innerHTML = '<strong>点评</strong> | 用户关注度' + fmtNum(fm.market_focus) + '，排名第' + (fm.market_focus_rank||'--') + '位；当日参与意愿变化' + (pc>=0?'<span class="highlight-red">+'+fmtNum(pc)+'%</span>':'<span class="highlight-green">'+fmtNum(pc)+'%</span>');

    document.getElementById('overallScore').textContent = fmtNum(s.overall_participation_score, 1);
    document.getElementById('recommendation').textContent = s.recommendation || '中性';

    const subs = [
        ['market_focus_score','用户关注'], ['participation_willingness_score','参与意愿'],
        ['five_day_average_score','五日平均'], ['trend_analysis_score','趋势评分']
    ];
    document.getElementById('subScores').innerHTML = subs.map(([k,l]) =>
        '<div class="sub-score"><div class="val">'+fmtNum(s[k],0)+'</div><div class="lbl">'+l+'</div></div>'
    ).join('');

    document.getElementById('attentionDesc').innerHTML = '今日关注指数 <span class="highlight-red">'+fmtNum(fm.market_focus)+'</span>，较上一日变化 <span class="'+(Number(fm.market_focus_change)>=0?'highlight-red':'highlight-green')+'">'+fmtNum(fm.market_focus_change,0)+'</span>，排名 '+fm.market_focus_rank+'/'+fm.total_market;

    const p5 = Number(pm.participation_wish_5days_change || 0);
    document.getElementById('participationDesc').innerHTML = '当日参与意愿变化 <span class="'+(pc>=0?'highlight-red':'highlight-green')+'">'+fmtNum(pc)+'%</span>，五日平均变化 <span class="'+(p5>=0?'highlight-red':'highlight-green')+'">'+fmtNum(p5)+'%</span>';

    if (!attentionChart) attentionChart = echarts.init(document.getElementById('attention-chart'));
    const fDates = p.focusRows.map(r => fmtShortDate(r.TRADE_DATE));
    const focusVals = p.focusRows.map(r => r.MARKET_FOCUS);
    const prices = p.focusRows.map(r => r.CLOSE_PRICE);
    attentionChart.setOption({
        tooltip: { trigger: 'axis' }, legend: { data: ['关注指数','收盘价'], top: 0 },
        grid: { left: '8%', right: '8%', bottom: '12%', top: '15%' },
        xAxis: { type: 'category', data: fDates, boundaryGap: false },
        yAxis: [{ type: 'value', name: '指数' }, { type: 'value', name: '价格', position: 'right' }],
        series: [
            { name: '关注指数', type: 'line', data: focusVals, smooth: true, lineStyle: { color: '#42a5f5', width: 2 } },
            { name: '收盘价', type: 'line', yAxisIndex: 1, data: prices, smooth: true, lineStyle: { color: '#ff9800', width: 2 } }
        ]
    }, true);

    if (!participationChart) participationChart = echarts.init(document.getElementById('participation-chart'));
    const pDates = p.partRows.map(r => fmtShortDate(r.TRADE_DATE));
    const changes = p.partRows.map(r => Number(r.PARTICIPATION_WISH_CHANGE || 0));
    const avg5 = p.partRows.map(r => Number(r.PARTICIPATION_WISH_5DAYSCHANGE || 0));
    participationChart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['当日意愿变化','五日平均变化'], top: 0 },
        grid: { left: '10%', right: '8%', bottom: '12%', top: '15%' },
        xAxis: { type: 'category', data: pDates },
        yAxis: { type: 'value', name: '%' },
        series: [
            { name: '当日意愿变化', type: 'bar', data: changes.map(v => ({ value: v, itemStyle: { color: v >= 0 ? '#e74c3c' : '#27ae60' } })) },
            { name: '五日平均变化', type: 'line', data: avg5, lineStyle: { color: '#ff9800', width: 2 }, symbol: 'circle' }
        ]
    }, true);

    const analysis = s.analysis || [];
    document.getElementById('analysisList').innerHTML = analysis.length ? analysis.map(t=>'<li>'+t+'</li>').join('') : '<li>暂无分析</li>';
}

async function fetchData() {
    try {
        const r = await (await fetch('/api/stock/'+stockCode+'/market-heat')).json();
        document.getElementById('rawDataJson').textContent = JSON.stringify(r, null, 2);
        if (r.cache_file_path) document.getElementById('rawDataTitle').innerHTML = '📊 Raw Data (Module 4) <span style="color:#aaa;font-size:12px;margin-left:8px;">📁 '+r.cache_file_path.split('/').pop()+'</span>';
        if (r.success && r.data) updateUI(r.data);
        else document.getElementById('loadingBanner').textContent = '加载失败';
    } catch (e) { document.getElementById('loadingBanner').textContent = '加载失败: '+e.message; }
}
function toggleRawData() {
    document.getElementById('rawDataContent').classList.toggle('collapsed');
    document.querySelector('.raw-data-toggle').classList.toggle('collapsed');
}
window.addEventListener('resize', () => { attentionChart && attentionChart.resize(); participationChart && participationChart.resize(); });
window.addEventListener('load', fetchData);
</script>
    <script src="/static/app_nav_shortcuts.js?v=3"></script>
</body>
</html>
