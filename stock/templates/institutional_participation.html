<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主力控盘 - {{ stock_code }}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eaec;
        }

        .page-header h1 { font-size: 28px; color: #2c3e50; }
        .page-header .date { font-size: 14px; color: #7f8c8d; }

        .loading-banner { text-align: center; padding: 40px; color: #7f8c8d; }
        .loading-banner.hidden { display: none; }

        .comment-header {
            display: flex;
            align-items: flex-start;
            padding: 15px 20px;
            background: #fff3e0;
            border-radius: 6px;
            margin-bottom: 24px;
            border-left: 4px solid #ff9800;
        }

        .comment-header .icon {
            width: 28px; height: 28px;
            background: #ff9800;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px;
            margin-right: 12px; flex-shrink: 0;
        }

        .comment-header .text { color: #e65100; font-size: 15px; line-height: 1.7; }

        .score-row {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .score-row { grid-template-columns: 1fr; }
        }

        .score-card {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
        }

        .score-card .big-score { font-size: 56px; font-weight: bold; line-height: 1; }
        .score-card .label { font-size: 16px; margin-top: 8px; opacity: 0.9; }
        .score-card .rec {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.25);
            font-size: 13px;
        }

        .sub-scores {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        @media (max-width: 900px) {
            .sub-scores { grid-template-columns: repeat(2, 1fr); }
        }

        .sub-score {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
        }

        .sub-score .val { font-size: 22px; font-weight: bold; color: #ff9800; }
        .sub-score .lbl { font-size: 12px; color: #7f8c8d; margin-top: 6px; }

        .metrics-strip {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .metrics-strip { grid-template-columns: repeat(2, 1fr); }
        }

        .metric-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

        .metric-card .val { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .metric-card .lbl { font-size: 12px; color: #7f8c8d; margin-top: 6px; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .chart-section {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .chart-section h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .chart-box { width: 100%; height: 340px; }
        .chart-box.tall { height: 380px; }

        .chart-note {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .full-width { grid-column: 1 / -1; }

        .cost-stats {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 12px;
        }

        .cost-stats .stat-label { color: #7f8c8d; font-size: 12px; }
        .cost-stats .stat-value { font-size: 18px; font-weight: bold; color: #2c3e50; margin-top: 4px; }
        .cost-stats .stat-value.highlight { color: #e74c3c; }

        .risk-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 700px) {
            .risk-panel { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .panel-box h3 { font-size: 16px; color: #2c3e50; margin-bottom: 12px; }

        .risk-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .risk-badge.low { background: #e8f5e9; color: #2e7d32; }
        .risk-badge.mid { background: #fff3e0; color: #e65100; }
        .risk-badge.high { background: #fdecea; color: #c62828; }

        .analysis-list { list-style: none; }
        .analysis-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .analysis-list li:last-child { border-bottom: none; }

        .control-legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .legend-color { width: 14px; height: 14px; border-radius: 2px; }

        .raw-data-container {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
        }

        .raw-data-header {
            background: #343a40;
            color: white;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .raw-data-toggle { transition: transform 0.3s; }
        .raw-data-toggle.collapsed { transform: rotate(-90deg); }

        .raw-data-content {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .raw-data-content.collapsed { display: none; }

        .raw-data-json {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            color: #495057;
        }

        #mainContent { display: none; }
        #mainContent.visible { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>主力控盘</h1>
            <div class="date" id="pageDate">加载中...</div>
        </div>

        <div class="loading-banner" id="loadingBanner">正在加载主力控盘数据...</div>

        <div id="mainContent">
            <div class="comment-header">
                <div class="icon">💡</div>
                <div class="text" id="commentText"><strong>点评</strong> | --</div>
            </div>

            <div class="score-row">
                <div class="score-card">
                    <div class="big-score" id="overallScore">--</div>
                    <div class="label">控盘综合评分</div>
                    <div class="rec" id="recommendation">--</div>
                </div>
                <div class="sub-scores" id="subScores"></div>
            </div>

            <div class="metrics-strip" id="metricsStrip"></div>

            <div class="content-grid">
                <div class="chart-section">
                    <div class="control-legend">
                        <div class="legend-item"><span class="legend-color" style="background:#fdd835"></span>完全控盘</div>
                        <div class="legend-item"><span class="legend-color" style="background:#fb8c00"></span>不控盘</div>
                        <div class="legend-item"><span class="legend-color" style="background:#1976d2"></span>中度控盘</div>
                        <div class="legend-item"><span class="legend-color" style="background:#42a5f5"></span>轻度控盘</div>
                    </div>
                    <div class="chart-box" id="pie-chart"></div>
                    <div class="chart-note" id="pieNote">--</div>
                </div>

                <div class="chart-section">
                    <h3>主力成本对比</h3>
                    <div class="chart-box" id="bar-chart"></div>
                    <div class="cost-stats">
                        <div><div class="stat-label">最近1日</div><div class="stat-value highlight" id="cost1d">--</div></div>
                        <div><div class="stat-label">最近20日</div><div class="stat-value" id="cost20d">--</div></div>
                        <div><div class="stat-label">最近60日</div><div class="stat-value" id="cost60d">--</div></div>
                        <div><div class="stat-label">当前价</div><div class="stat-value" id="currentPrice">--</div></div>
                    </div>
                </div>

                <div class="chart-section full-width">
                    <h3>机构参与度变化趋势</h3>
                    <div class="chart-box tall" id="line-chart"></div>
                    <div class="chart-note">注解：曲线为机构参与程度变化图</div>
                </div>

                <div class="chart-section full-width">
                    <h3>主力净流入趋势（万元）</h3>
                    <div class="chart-box tall" id="flow-chart"></div>
                    <div class="chart-note">注解：柱状图为主力净流入，红色为流出</div>
                </div>
            </div>

            <div class="risk-panel">
                <div class="panel-box">
                    <h3>风险评估</h3>
                    <div id="riskBadge" class="risk-badge mid">--</div>
                    <div id="riskScore" style="font-size:14px;color:#666;margin-bottom:10px;">--</div>
                    <ul class="analysis-list" id="riskFactors"></ul>
                </div>
                <div class="panel-box">
                    <h3>分析要点</h3>
                    <ul class="analysis-list" id="analysisList"></ul>
                </div>
            </div>
        </div>

        <div class="raw-data-container">
            <div class="raw-data-header" onclick="toggleRawData()">
                <span id="rawDataTitle">📊 Raw Data (Module 2 - Main Force Control)</span>
                <span class="raw-data-toggle collapsed">▼</span>
            </div>
            <div class="raw-data-content collapsed" id="rawDataContent">
                <div class="raw-data-json" id="rawDataJson">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const stockCode = '{{ stock_code }}';
        let pieChart, barChart, lineChart, flowChart;

        const CONTROL_COLORS = {
            '完全控盘': '#fdd835',
            '中度控盘': '#1976d2',
            '轻度控盘': '#42a5f5',
            '无控盘': '#fb8c00',
            '不控盘': '#fb8c00',
        };

        function extractRows(obj) {
            return (obj && obj.result && obj.result.data) ? obj.result.data : [];
        }

        function fmtNum(v, d = 2) {
            if (v === null || v === undefined || isNaN(Number(v))) return '--';
            return Number(v).toFixed(d);
        }

        // ratio: 0.37 → 37%; alreadyPct: 0.61 → 0.61%, 8.33 → 8.33%
        function fmtPct(v, signed = false, alreadyPct = false) {
            if (v === null || v === undefined || isNaN(Number(v))) return '--';
            const n = Number(v);
            const val = alreadyPct ? n : (Math.abs(n) > 1 ? n : n * 100);
            const prefix = signed && val > 0 ? '+' : '';
            return prefix + val.toFixed(2) + '%';
        }

        function fmtMoneyWan(v) {
            if (v === null || v === undefined || isNaN(Number(v))) return '--';
            return (Number(v) / 10000).toFixed(2);
        }

        function fmtDate(raw) {
            if (!raw) return '--';
            const d = new Date(String(raw).replace(' ', 'T'));
            if (isNaN(d.getTime())) return String(raw).slice(0, 10);
            return d.toLocaleDateString('zh-CN');
        }

        function fmtShortDate(raw) {
            if (!raw) return '';
            const d = new Date(String(raw).replace(' ', 'T'));
            if (isNaN(d.getTime())) return String(raw).slice(5, 10);
            return (d.getMonth() + 1).toString().padStart(2, '0') + '-' + d.getDate().toString().padStart(2, '0');
        }

        function recLabel(rec) {
            const map = {
                strong_positive: '强烈看好',
                positive: '偏积极',
                neutral: '中性',
                negative: '偏谨慎',
            };
            return map[rec] || rec || '中性';
        }

        function parseMainForce(moduleWrapper) {
            const inner = (moduleWrapper && moduleWrapper.data) ? moduleWrapper.data : (moduleWrapper || {});
            const summary = inner.main_force_summary || {};
            const rows = extractRows(inner.evaluation_analysis)
                .slice()
                .sort((a, b) => new Date(a.TRADE_DATE) - new Date(b.TRADE_DATE));
            const latest = rows.length ? rows[rows.length - 1] : {};

            return {
                timestamp: moduleWrapper.timestamp,
                summary,
                rows,
                latest,
                control: summary.control_indicators || {},
                flow: summary.flow_indicators || {},
                cost: summary.cost_indicators || {},
                keyMetrics: summary.key_metrics || {},
                risk: summary.risk_assessment || {},
            };
        }

        function buildComment(parsed) {
            const p = parsed.control;
            const ratio = fmtPct(p.participate_ratio);
            const type = p.participate_type || '未知';
            const cost = parsed.latest.PRIME_COST || parsed.cost.prime_cost;
            const cost20 = parsed.latest.PRIME_COST_20DAYS;
            const cost60 = parsed.latest.PRIME_COST_60DAYS;
            let text = '机构参与度为' + ratio + '，属于' + type;
            if (cost) text += '，最近1日主力成本' + fmtNum(cost) + '元';
            if (cost20) text += '，最近20日主力成本' + fmtNum(cost20) + '元';
            if (cost60) text += '，最近60日主力成本' + fmtNum(cost60) + '元';
            return text;
        }

        function renderSubScores(summary) {
            const items = [
                ['institutional_participation_score', '机构参与'],
                ['control_type_score', '控盘类型'],
                ['main_force_flow_score', '资金流向'],
                ['cost_analysis_score', '成本分析'],
                ['performance_score', '近期表现'],
            ];
            document.getElementById('subScores').innerHTML = items.map(([k, lbl]) =>
                '<div class="sub-score"><div class="val">' + fmtNum(summary[k], 0) + '</div><div class="lbl">' + lbl + '</div></div>'
            ).join('');
        }

        function renderMetricsStrip(km, flow, control) {
            const cards = [
                ['收盘价', '¥' + fmtNum(km.close_price)],
                ['涨跌幅', fmtPct(km.change_rate, true, true)],
                ['换手率', fmtPct(km.turnover_rate, false, true)],
                ['机构参与', fmtPct(control.participate_ratio)],
                ['主力净流入', fmtMoneyWan(flow.prime_inflow) + '万'],
                ['控盘强度', control.control_strength || '--'],
            ];
            document.getElementById('metricsStrip').innerHTML = cards.map(([lbl, val]) =>
                '<div class="metric-card"><div class="val">' + val + '</div><div class="lbl">' + lbl + '</div></div>'
            ).join('');
        }

        function renderPieChart(parsed) {
            if (!pieChart) pieChart = echarts.init(document.getElementById('pie-chart'));
            const ratio = Number(parsed.control.participate_ratio || 0);
            const pct = ratio > 1 ? ratio : ratio * 100;
            const type = parsed.control.participate_type || '未知';
            const color = CONTROL_COLORS[type] || '#1976d2';

            pieChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
                series: [{
                    type: 'pie',
                    radius: ['48%', '72%'],
                    label: { show: false },
                    data: [
                        { value: +pct.toFixed(2), name: type, itemStyle: { color } },
                        { value: +(100 - pct).toFixed(2), name: '其他', itemStyle: { color: '#e0e0e0' } },
                    ],
                }],
                graphic: [{
                    type: 'text',
                    left: 'center',
                    top: 'middle',
                    style: {
                        text: pct.toFixed(2) + '%\n' + type,
                        textAlign: 'center',
                        fill: '#2c3e50',
                        fontSize: 16,
                        fontWeight: 'bold',
                        lineHeight: 22,
                    },
                }],
            }, true);

            document.getElementById('pieNote').textContent =
                '注解：机构参与度为' + pct.toFixed(2) + '%，属于' + type;
        }

        function renderBarChart(parsed) {
            if (!barChart) barChart = echarts.init(document.getElementById('bar-chart'));
            const l = parsed.latest;
            const costs = [
                l.PRIME_COST || parsed.cost.prime_cost,
                l.PRIME_COST_20DAYS,
                l.PRIME_COST_60DAYS,
                parsed.keyMetrics.close_price || parsed.cost.current_price,
            ];
            const labels = ['最近1日', '最近20日', '最近60日', '当前价'];
            const colors = ['#42a5f5', '#42a5f5', '#42a5f5', '#e74c3c'];

            document.getElementById('cost1d').textContent = fmtNum(costs[0]) + '元';
            document.getElementById('cost20d').textContent = fmtNum(costs[1]) + '元';
            document.getElementById('cost60d').textContent = fmtNum(costs[2]) + '元';
            document.getElementById('currentPrice').textContent = fmtNum(costs[3]) + '元';

            const valid = costs.filter(v => v != null && !isNaN(Number(v)));
            const yMin = valid.length ? Math.floor(Math.min(...valid) * 0.92) : 0;
            const yMax = valid.length ? Math.ceil(Math.max(...valid) * 1.08) : 100;

            barChart.setOption({
                grid: { left: '12%', right: '8%', bottom: '12%', top: '8%' },
                xAxis: {
                    type: 'category',
                    data: labels,
                    axisLine: { lineStyle: { color: '#bdbdbd' } },
                },
                yAxis: {
                    type: 'value',
                    name: '价格(元)',
                    min: yMin,
                    max: yMax,
                    splitLine: { lineStyle: { color: '#e0e0e0', type: 'dashed' } },
                },
                series: [{
                    type: 'bar',
                    barWidth: '45%',
                    data: costs.map((v, i) => ({
                        value: v || 0,
                        itemStyle: { color: colors[i] },
                    })),
                    label: {
                        show: true,
                        position: 'top',
                        formatter: (p) => p.value > 0 ? Number(p.value).toFixed(2) : '',
                    },
                }],
            }, true);
        }

        function renderLineChart(rows) {
            if (!lineChart) lineChart = echarts.init(document.getElementById('line-chart'));
            const dates = rows.map(r => fmtShortDate(r.TRADE_DATE));
            const values = rows.map(r => {
                const v = Number(r.ORG_PARTICIPATE || 0);
                return v > 1 ? v : v * 100;
            });

            const yMin = values.length ? Math.floor(Math.min(...values) - 3) : 0;
            const yMax = values.length ? Math.ceil(Math.max(...values) + 3) : 100;

            lineChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: (params) => params[0].name + '<br/>' + params[0].marker + ' ' + params[0].value.toFixed(2) + '%',
                },
                grid: { left: '8%', right: '5%', bottom: '12%', top: '8%' },
                xAxis: {
                    type: 'category',
                    data: dates,
                    boundaryGap: false,
                    axisLine: { lineStyle: { color: '#bdbdbd' } },
                },
                yAxis: {
                    type: 'value',
                    name: '(百分比%)',
                    min: yMin,
                    max: yMax,
                    splitLine: { lineStyle: { color: '#e0e0e0', type: 'dashed' } },
                },
                series: [{
                    type: 'line',
                    data: values,
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 5,
                    lineStyle: { color: '#1976d2', width: 2 },
                    itemStyle: { color: '#1976d2' },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(25,118,210,0.2)' },
                                { offset: 1, color: 'rgba(25,118,210,0.02)' },
                            ],
                        },
                    },
                }],
            }, true);
        }

        function renderFlowChart(rows) {
            if (!flowChart) flowChart = echarts.init(document.getElementById('flow-chart'));
            const dates = rows.map(r => fmtShortDate(r.TRADE_DATE));
            const flows = rows.map(r => Number(r.PRIME_INFLOW || 0) / 10000);

            flowChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: (params) => params[0].name + '<br/>净流入: ' + params[0].value.toFixed(2) + ' 万元',
                },
                grid: { left: '8%', right: '5%', bottom: '12%', top: '8%' },
                xAxis: { type: 'category', data: dates },
                yAxis: { type: 'value', name: '万元' },
                series: [{
                    type: 'bar',
                    data: flows.map(v => ({
                        value: v,
                        itemStyle: { color: v >= 0 ? '#e74c3c' : '#27ae60' },
                    })),
                }],
            }, true);
        }

        function renderRisk(risk) {
            const level = risk.risk_level || '中';
            const badge = document.getElementById('riskBadge');
            badge.textContent = '风险等级：' + level;
            badge.className = 'risk-badge ' + (level === '高' ? 'high' : level === '低' ? 'low' : 'mid');
            document.getElementById('riskScore').textContent =
                '风险评分：' + fmtNum(risk.risk_score, 0) + ' / 100';
            const factors = risk.risk_factors || [];
            document.getElementById('riskFactors').innerHTML = factors.length
                ? factors.map(f => '<li>⚠ ' + f + '</li>').join('')
                : '<li>暂无明显风险因素</li>';
        }

        function updateUI(moduleWrapper) {
            const parsed = parseMainForce(moduleWrapper);
            const summary = parsed.summary;

            document.title = '主力控盘 - ' + stockCode;
            document.getElementById('loadingBanner').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');

            document.getElementById('pageDate').textContent =
                fmtDate(parsed.timestamp) + (parsed.keyMetrics.trade_date ? ' · 数据日 ' + fmtDate(parsed.keyMetrics.trade_date) : '');

            document.getElementById('commentText').innerHTML =
                '<strong>点评</strong> | ' + buildComment(parsed);

            document.getElementById('overallScore').textContent = fmtNum(summary.overall_control_score, 1);
            document.getElementById('recommendation').textContent = recLabel(summary.recommendation);

            renderSubScores(summary);
            renderMetricsStrip(parsed.keyMetrics, parsed.flow, parsed.control);
            renderPieChart(parsed);
            renderBarChart(parsed);
            if (parsed.rows.length) {
                renderLineChart(parsed.rows);
                renderFlowChart(parsed.rows);
            }

            renderRisk(parsed.risk);

            const analysis = (summary.analysis || []).filter(Boolean);
            document.getElementById('analysisList').innerHTML = analysis.length
                ? analysis.map(t => '<li>' + t + '</li>').join('')
                : '<li>暂无分析数据</li>';
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/stock/' + stockCode + '/institutional');
                const result = await response.json();
                updateRawData(result);
                if (result.cache_file_path) updateCacheFilePath(result.cache_file_path);
                if (result.success && result.data) {
                    updateUI(result.data);
                } else {
                    document.getElementById('loadingBanner').textContent =
                        '加载失败: ' + (result.error || '未知错误');
                }
            } catch (error) {
                updateRawData({ error: error.message });
                document.getElementById('loadingBanner').textContent = '加载失败: ' + error.message;
            }
        }

        function updateRawData(data) {
            document.getElementById('rawDataJson').textContent = JSON.stringify(data, null, 2);
        }

        function updateCacheFilePath(path) {
            const title = document.getElementById('rawDataTitle');
            if (title && path) {
                const filename = path.split('/').pop();
                title.innerHTML = '📊 Raw Data (Module 2) <span style="color:#aaa;font-size:12px;margin-left:8px;">📁 ' + filename + '</span>';
            }
        }

        function toggleRawData() {
            document.getElementById('rawDataContent').classList.toggle('collapsed');
            document.querySelector('.raw-data-toggle').classList.toggle('collapsed');
        }

        window.addEventListener('resize', () => {
            [pieChart, barChart, lineChart, flowChart].forEach(c => c && c.resize());
        });

        window.addEventListener('load', fetchData);
    </script>
    <script src="/static/app_nav_shortcuts.js?v=3"></script>
</body>
</html>
