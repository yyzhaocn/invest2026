<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趋势研判 - {{ stock_code }}</title>
    {% if embed %}
    <style>
        body { padding: 8px !important; background: #fff !important; }
        .container { box-shadow: none !important; padding: 12px !important; margin: 0 !important; max-width: none !important; }
        .page-header { display: none !important; }
        .raw-data-container { display: none !important; }
    </style>
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1500px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 3px solid #3498db; }
        .page-header h1 { font-size: 28px; color: #2c3e50; }
        .page-header .date { font-size: 14px; color: #7f8c8d; }
        .loading-banner { text-align: center; padding: 40px; color: #7f8c8d; }
        .loading-banner.hidden { display: none; }
        .comment-header { display: flex; align-items: flex-start; padding: 15px 20px; background: #f5f5f5; border-radius: 6px; margin-bottom: 24px; border-left: 4px solid #ff9800; }
        .comment-header .icon { width: 28px; height: 28px; background: #ff9800; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-right: 12px; flex-shrink: 0; }
        .comment-header .text { color: #e65100; font-size: 15px; line-height: 1.8; flex: 1; }
        .score-row { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 900px) { .score-row { grid-template-columns: 1fr; } }
        .score-card { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; border-radius: 10px; padding: 24px; text-align: center; }
        .score-card .big { font-size: 48px; font-weight: bold; }
        .score-card .rec { display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 20px; background: rgba(255,255,255,0.25); font-size: 13px; }
        .sub-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sub-score { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 14px; text-align: center; }
        .sub-score .val { font-size: 22px; font-weight: bold; color: #9b59b6; }
        .sub-score .lbl { font-size: 12px; color: #7f8c8d; margin-top: 6px; }
        .content-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 1100px) { .content-grid { grid-template-columns: 1fr; } }
        .chart-container { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; }
        .charts-grid { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
        .chart-item { background: white; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
        .chart-title { background: linear-gradient(#e3f2fd,#bbdefb); padding: 10px; text-align: center; font-size: 14px; color: #1565c0; font-weight: 500; }
        .chart-image { width: 100%; height: 280px; object-fit: contain; background: white; display: block; }
        .chart-error { height: 280px; display: none; align-items: center; justify-content: center; color: #999; font-size: 14px; }
        .panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
        .panel-header { background: linear-gradient(#e3f2fd,#bbdefb); padding: 12px; text-align: center; font-weight: 500; color: #1565c0; }
        .panel-body { padding: 16px; font-size: 14px; line-height: 1.8; color: #2c3e50; }
        .price-info { display: flex; justify-content: space-around; margin-top: 16px; }
        .price-item { text-align: center; }
        .price-label { color: #7f8c8d; font-size: 13px; }
        .price-value { font-size: 20px; font-weight: bold; color: #2c3e50; margin-top: 6px; }
        .analysis-panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
        .analysis-list { list-style: none; }
        .analysis-list li { padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #555; }
        .raw-data-container { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; overflow: hidden; }
        .raw-data-header { background: #343a40; color: white; padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; }
        .raw-data-toggle.collapsed { transform: rotate(-90deg); }
        .raw-data-content.collapsed { display: none; }
        .raw-data-content { padding: 16px; max-height: 400px; overflow-y: auto; background: white; }
        .raw-data-json { font-family: monospace; font-size: 12px; white-space: pre-wrap; }
        #mainContent { display: none; }
        #mainContent.visible { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header"><h1>趋势研判</h1><div class="date" id="pageDate">加载中...</div></div>
    <div class="loading-banner" id="loadingBanner">正在加载趋势数据...</div>
    <div id="mainContent">
        <div class="comment-header"><div class="icon">💡</div><div class="text" id="headerText"><strong>点评</strong> | --</div></div>
        <div class="score-row">
            <div class="score-card"><div class="big" id="overallScore">--</div><div>趋势综合分</div><div class="rec" id="recommendation">--</div></div>
            <div class="sub-scores" id="subScores"></div>
        </div>
        <div class="content-grid">
            <div class="chart-container">
                <div class="charts-grid">
                    <div class="chart-item">
                        <div class="chart-title">实时走势</div>
                        <img class="chart-image" id="realtimeImg" alt="实时走势" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <div class="chart-error">实时走势图加载失败</div>
                    </div>
                    <div class="chart-item">
                        <div class="chart-title">K线图</div>
                        <img class="chart-image" id="klineImg" alt="K线图" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <div class="chart-error">K线图加载失败</div>
                    </div>
                </div>
            </div>
            <div>
                <div class="panel">
                    <div class="panel-header">趋势量能</div>
                    <div class="panel-body" id="volumeComment">--</div>
                    <div class="price-info">
                        <div class="price-item"><div class="price-label">⬇ 支撑位</div><div class="price-value" id="supportLevel">--</div></div>
                        <div class="price-item"><div class="price-label">⬆ 压力位</div><div class="price-value" id="resistanceLevel">--</div></div>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header">趋势指标</div>
                    <div class="panel-body" id="trendIndicators">--</div>
                </div>
            </div>
        </div>
        <div class="analysis-panel"><h3>趋势分析</h3><ul class="analysis-list" id="analysisList"></ul></div>
    </div>
    <div class="raw-data-container">
        <div class="raw-data-header" onclick="toggleRawData()"><span id="rawDataTitle">📊 Raw Data (Module 5)</span><span class="raw-data-toggle collapsed">▼</span></div>
        <div class="raw-data-content collapsed" id="rawDataContent"><div class="raw-data-json" id="rawDataJson">Loading...</div></div>
    </div>
</div>
<script>
const stockCode = '{{ stock_code }}';
const ts = Math.floor(Date.now()/1000);

function getMarketCode(code) {
    if (code.startsWith('60') || code.startsWith('68')) return '1.'+code;
    return '0.'+code;
}
function fmtNum(v,d=1){return (v==null||isNaN(Number(v)))?'--':Number(v).toFixed(d);}
function parseLevels(text) {
    const support = text.match(/支撑位([\d.]+)元/);
    const pressure = text.match(/压力位([\d.]+)元/);
    return { support: support?support[1]:null, pressure: pressure?pressure[1]:null };
}

function updateChartImages() {
    const nid = getMarketCode(stockCode);
    document.getElementById('realtimeImg').src = 'https://webquotepic.eastmoney.com/GetPic.aspx?imageType=r&type=&token=44c9d251add88e27b65ed86506f6e5da&nid='+nid+'&timespan='+ts;
    document.getElementById('klineImg').src = 'https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid='+nid+'&type=&unitWidth=-6&ef=&formula=RSI&AT=1&imageType=KXL&timespan='+ts;
}

function updateUI(mw) {
    const s = mw.summary || {};
    const cm = s.trend_comment_metrics || {};
    const comment = cm.comment_txt || '';
    const levels = parseLevels(comment);

    document.getElementById('loadingBanner').classList.add('hidden');
    document.getElementById('mainContent').classList.add('visible');
    document.title = '趋势研判 - '+stockCode;
    document.getElementById('pageDate').textContent = cm.trade_date ? String(cm.trade_date).slice(0,10) : new Date().toLocaleDateString('zh-CN');

    document.getElementById('headerText').innerHTML = '<strong>点评</strong> | ' + (comment || '暂无趋势评论');
    document.getElementById('overallScore').textContent = fmtNum(s.overall_trend_score, 1);
    document.getElementById('recommendation').textContent = s.recommendation || '中性';

    const subs = [['trend_comment_score','评论评分'],['volume_trend_score','量能评分'],['price_trend_score','价格评分'],['trend_strength_score','趋势强度']];
    document.getElementById('subScores').innerHTML = subs.map(([k,l])=>'<div class="sub-score"><div class="val">'+fmtNum(s[k],0)+'</div><div class="lbl">'+l+'</div></div>').join('');

    document.getElementById('volumeComment').textContent = comment || '暂无量能评论';
    document.getElementById('supportLevel').textContent = levels.support ? levels.support+'元' : '--';
    document.getElementById('resistanceLevel').textContent = levels.pressure ? levels.pressure+'元' : '--';

    const ti = s.trend_indicators || {};
    document.getElementById('trendIndicators').innerHTML = '趋势方向：<strong>'+(ti.trend||'--')+'</strong><br>趋势强度：<strong>'+(ti.strength||'--')+'</strong>';

    const analysis = s.analysis || [];
    document.getElementById('analysisList').innerHTML = analysis.length ? analysis.map(t=>'<li>'+t+'</li>').join('') : '<li>暂无分析</li>';
}

async function fetchData() {
    try {
        const r = await (await fetch('/api/stock/'+stockCode+'/trend')).json();
        document.getElementById('rawDataJson').textContent = JSON.stringify(r, null, 2);
        if (r.success && r.data) updateUI(r.data);
        else document.getElementById('loadingBanner').textContent = '加载失败';
    } catch(e) { document.getElementById('loadingBanner').textContent = '加载失败: '+e.message; }
}
function toggleRawData() {
    document.getElementById('rawDataContent').classList.toggle('collapsed');
    document.querySelector('.raw-data-toggle').classList.toggle('collapsed');
}
window.addEventListener('load', () => { updateChartImages(); fetchData(); });
</script>
    <script src="/static/app_nav_shortcuts.js?v=3"></script>
</body>
</html>
