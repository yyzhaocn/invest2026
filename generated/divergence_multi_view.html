function flashUrl(c){return 'https://webquotepic.eastmoney.com/GetPic.aspx?imageType=r&type=&token='+TOKEN+'&nid='+nid(c)+'&timespan='+KTS;}
function pageUrl(c){return 'https://quote.eastmoney.com/'+(c[0]==='6'?'sh':'sz')+c+'.html';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bindHover(){
  document.querySelectorAll('tr.hover-row').forEach(tr=>{
    tr.onmouseenter=()=>{
      const c=tr.dataset.code;
      kname.textContent=tr.dataset.name+' ('+c+') · 东财K线';
      kimg.src=klineUrl(c);
      ktip.style.display='block';
    };
    tr.onmousemove=e=>{
      let x=e.clientX+16,y=e.clientY+12;
      if(x+270>innerWidth)x=e.clientX-276;
      if(y+220>innerHeight)y=e.clientY-210;
      ktip.style.left=x+'px';ktip.style.top=y+'px';
    };
    tr.onmouseleave=()=>{ktip.style.display='none'};
  });
}
function toggleEmbed(btn){
  const row=btn.closest('tr'), c=row.dataset.code, name=row.dataset.name;
  const next=row.nextElementSibling;
  if(next&&next.classList.contains('embed-row')){next.remove();btn.textContent='▶ 图';return;}
  const img1='<a href="'+pageUrl(c)+'" target="_blank"><img src="'+klineUrl(c)+'" alt="K线"></a>'+
            '<div class="cap">📈 日K线 · RSI（东财官方，点击放大）</div>';
  const img2='<a href="'+pageUrl(c)+'" target="_blank"><img src="'+flashUrl(c)+'" alt="分时"></a>'+
            '<div class="cap">⏱ 分时快照（东财官方）</div>';
  const tr2=document.createElement('tr');tr2.className='embed-row';
  tr2.innerHTML='<td colspan="7"><div class="charts">'+
    '<div class="chart">'+img1+'</div><div class="chart">'+img2+'</div></div></td>';
  row.after(tr2);
  btn.textContent='▼ 收起';
}
function render(f){
  let rs=R.filter(r=>{
    if(f==='all')return true;
    if(f==='3')return r.score>=3;
    return r.type===f;
  }).sort((a,b)=>b.score-a.score);
  tb.innerHTML=rs.map(r=>{
    const tags=r.indicators.map(i=>'<span class="tag '+(IN[i]||'')+'">'+i+'</span>').join('');
    const sc=r.score>=3?'<span class="sc sc3">'+r.score+'重</span>':'<span class="sc sc2">'+r.score+'重</span>';
    const dir=r.type==='底背离'?'<span class="bull">🔴 底背离</span>':'<span class="bear">🟢 顶背离</span>';
    return '<tr class="hover-row" data-code="'+r.code+'" data-name="'+esc(r.name)+'">'+
      '<td><button class="expand" type="button">▶ 图</button></td>'+
      '<td><b>'+r.name+'</b> <span style="color:#5c6572">'+r.code+'</span></td>'+
      '<td>'+dir+'</td><td>'+sc+'</td><td>'+tags+'</td>'+
      '<td>'+r.p1_date+' ('+r.p1+')</td><td>'+r.p2_date+' ('+r.p2+')</td></tr>';
  }).join('')||'<tr><td colspan="7" style="text-align:center;color:#5c6572">无匹配</td></tr>';
  bindHover();
  document.querySelectorAll('button.expand').forEach(b=>b.onclick=()=>toggleEmbed(b));
}
render('all');
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');render(b.dataset.f);
});
</script></body></html>
