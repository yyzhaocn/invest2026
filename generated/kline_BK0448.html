const svg=document.getElementById('p'),NS='http://www.w3.org/2000/svg';
const W=960, PH=340, VH=130, n=D.length;
const X=i=>40+(i/(n-1))*880;
const lo=Math.min(...D.map(d=>d.l)), hi=Math.max(...D.map(d=>d.h));
const pad=(hi-lo)*0.08;
const Y=v=>PH-10-((v-(lo-pad))/((hi+pad)-(lo-pad)))*PH;
const VY=v=>PH+30-((v)/(Math.max(...D.map(d=>d.v))))*VH;
const bw=Math.max(6, 860/n*0.6);
// candles
D.forEach((d,i)=>{
  const up=d.c>=d.o;
  const col=up?'#ff4d4f':'#2ecc71';
  const x=X(i);
  // wick
  let w=document.createElementNS(NS,'line');
  w.setAttribute('x1',x);w.setAttribute('y1',Y(d.h));w.setAttribute('x2',x);w.setAttribute('y2',Y(d.l));
  w.setAttribute('stroke',col);w.setAttribute('stroke-width',1);svg.appendChild(w);
  // body
  let b=document.createElementNS(NS,'rect');
  b.setAttribute('x',x-bw/2);b.setAttribute('y',Math.min(Y(d.o),Y(d.c)));b.setAttribute('width',bw);
  b.setAttribute('height',Math.max(Math.abs(Y(d.o)-Y(d.c)),1));b.setAttribute('fill',col);b.setAttribute('opacity','0.9');
  svg.appendChild(b);
  // volume
  let v=document.createElementNS(NS,'rect');
  v.setAttribute('x',x-bw/2);v.setAttribute('y',VY(d.v));v.setAttribute('width',bw);
  v.setAttribute('height',PH+30+VH-VY(d.v));v.setAttribute('fill',up?'#ff4d4f':'#2ecc71');v.setAttribute('opacity','0.5');
  svg.appendChild(v);
});
// MA lines
function line(key,col){
  let s='';D.forEach((d,i)=>{s+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(d[key]).toFixed(1)});
  const el=document.createElementNS(NS,'path');el.setAttribute('d',s);el.setAttribute('stroke',col);
  el.setAttribute('stroke-width',1.5);el.setAttribute('fill','none');el.setAttribute('vector-effect','non-scaling-stroke');
  svg.appendChild(el);
}
